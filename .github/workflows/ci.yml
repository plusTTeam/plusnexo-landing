# Gate de calidad (lint + format + build) para la landing de +Nexo. El
# deploy en sí lo maneja la integración nativa de Netlify (webhook de Git),
# no este workflow — ver design.md del change landing-nexo (rama main,
# openspec/changes/landing-nexo/), Decisión 9.
name: CI

on:
  push:
    branches: [website]
  pull_request:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Build (Astro)
        run: npm run build
